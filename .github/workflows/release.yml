name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev \
            libgtk-3-dev \
            wget curl file patchelf \
            imagemagick

      - name: Download Creepster font
        run: |
          mkdir -p assets
          curl -fsSL \
            "https://fonts.gstatic.com/s/creepster/v13/AlZy_zVUqzYAsQ-2-mk5BA.woff2" \
            -o /tmp/creepster.woff2 || true
          # Prefer TTF for fontconfig compatibility
          curl -fsSL \
            "https://github.com/google/fonts/raw/main/ofl/creepster/Creepster-Regular.ttf" \
            -o assets/Creepster-Regular.ttf || \
          echo "WARNING: Could not download Creepster font — button will use fallback font."

      - name: Copy icons from optimized-icons
        run: |
          ICON_SRC="/home/runner/work/_temp"  # won't exist on CI runner, handled below
          # Icons are expected in assets/ already OR we copy from optimized-icons if present
          for SIZE in 16 24 32 48 64 96 128 256 512; do
            SRC="assets/stake-${SIZE}.png"
            if [ ! -f "$SRC" ]; then
              echo "Missing $SRC — skipping"
            fi
          done

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb

      - name: Download linuxdeploy and appimage plugin
        run: |
          # 1. Download and extract core linuxdeploy
          curl -fsSL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract
          sudo mkdir -p /usr/local/share/linuxdeploy
          sudo mv squashfs-root/* /usr/local/share/linuxdeploy/
          rm -rf squashfs-root linuxdeploy
          
          # Create self-contained wrapper for linuxdeploy
          echo '#!/bin/sh' | sudo tee /usr/local/bin/linuxdeploy
          echo 'exec /usr/local/share/linuxdeploy/AppRun "$@"' | sudo tee -a /usr/local/bin/linuxdeploy
          sudo chmod +x /usr/local/bin/linuxdeploy

          # 2. Download and extract linuxdeploy-plugin-appimage
          curl -fsSL -o linuxdeploy-plugin-appimage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy-plugin-appimage
          ./linuxdeploy-plugin-appimage --appimage-extract
          sudo mkdir -p /usr/local/share/linuxdeploy-plugin-appimage
          sudo mv squashfs-root/* /usr/local/share/linuxdeploy-plugin-appimage/
          rm -rf squashfs-root linuxdeploy-plugin-appimage

          # Create self-contained wrapper for the appimage plugin
          echo '#!/bin/sh' | sudo tee /usr/local/bin/linuxdeploy-plugin-appimage
          echo 'exec /usr/local/share/linuxdeploy-plugin-appimage/AppRun "$@"' | sudo tee -a /usr/local/bin/linuxdeploy-plugin-appimage
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-appimage


      - name: Assemble AppDir
        run: |
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/scalable/apps" \
            "$APPDIR/usr/share/icons/hicolor/16x16/apps" \
            "$APPDIR/usr/share/icons/hicolor/32x32/apps" \
            "$APPDIR/usr/share/icons/hicolor/48x48/apps" \
            "$APPDIR/usr/share/icons/hicolor/64x64/apps" \
            "$APPDIR/usr/share/icons/hicolor/96x96/apps" \
            "$APPDIR/usr/share/icons/hicolor/128x128/apps" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
            "$APPDIR/usr/share/icons/hicolor/512x512/apps" \
            "$APPDIR/usr/share/fonts/truetype/stake"

          cp target/release/stake "$APPDIR/usr/bin/"
          cp assets/stake.desktop  "$APPDIR/usr/share/applications/"

          for SIZE in 16 32 48 64 96 128 256 512; do
            SRC="assets/stake-${SIZE}.png"
            [ -f "$SRC" ] && cp "$SRC" "$APPDIR/usr/share/icons/hicolor/${SIZE}x${SIZE}/apps/stake.png"
          done
          [ -f assets/stake.svg ] && cp assets/stake.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/stake.svg"
          [ -f assets/Creepster-Regular.ttf ] && cp assets/Creepster-Regular.ttf "$APPDIR/usr/share/fonts/truetype/stake/"

      - name: Build AppImage
        run: |
          ARCH=x86_64 linuxdeploy \
            --appdir AppDir \
            --desktop-file assets/stake.desktop \
            --icon-file assets/stake-256.png \
            --output appimage
        env:
          OUTPUT: Stake-${{ github.ref_name }}-x86_64.AppImage

      - name: Rename artifacts
        run: |
          DEB=$(find target/debian -name '*.deb' | head -1)
          mv "$DEB" "stake-${{ github.ref_name }}-amd64.deb"
          APPIMAGE=$(find . -maxdepth 1 -name '*.AppImage' | head -1)
          mv "$APPIMAGE" "Stake-${{ github.ref_name }}-x86_64.AppImage"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            stake-${{ github.ref_name }}-amd64.deb
            Stake-${{ github.ref_name }}-x86_64.AppImage
          generate_release_notes: true
